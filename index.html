<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Bharath's Weather Application</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div class="app-background">
    <div class="overlay"></div>
  </div>

  <div class="main-wrapper">
    <!-- Top Search Header -->
    <header class="search-section">
      <form id="search-form" class="search-form" autocomplete="off">
        <div class="search-bar">
          <input type="text" id="search-input" class="search-input" placeholder="Search City" aria-label="Search City"
            required />
          <button type="submit" id="search-btn" class="search-btn" aria-label="Search">
            <svg class="search-icon-svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.3" y2="16.3"></line>
            </svg>
          </button>
        </div>
        <button type="button" id="geo-btn" class="geo-btn" title="Use Current Location">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
          </svg>
        </button>
        <div id="search-suggestions" class="search-suggestions hidden"></div>
      </form>
    </header>

    <!-- Error / Loading Notification -->
    <div id="toast-message" class="toast-message hidden"></div>

    <!-- Main Content Grid -->
    <main class="dashboard-grid">
      <!-- Left Column: Current Weather + 5 Days Forecast -->
      <section class="left-column">
        <!-- Main Current Weather Card -->
        <div class="glass-card current-weather-card">
          <div class="current-header">
            <h2 id="city-name" class="city-name">City Name</h2>
            <div id="country-tag" class="country-tag">--</div>
          </div>

          <div class="temperature-row">
            <span id="current-temp" class="current-temp">- °C</span>
            <div id="current-weather-icon" class="current-weather-icon">
              <!-- Animated / SVG icon here -->
            </div>
          </div>

          <p id="sky-description" class="sky-description">Sky Description</p>

          <div class="divider"></div>

          <div class="meta-row">
            <div class="meta-item">
              <svg class="meta-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              <span id="current-date" class="meta-text">Date</span>
            </div>

            <div class="meta-item">
              <svg class="meta-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span id="current-time" class="meta-text">Time</span>
            </div>
          </div>
        </div>

        <!-- Coming 5 Days Forecast Card -->
        <div class="glass-card forecast-card">
          <h3 class="card-heading">Coming 5 Days</h3>
          <div id="forecast-list" class="forecast-list">
            <!-- 5 days dynamically injected -->
            <div class="forecast-skeleton">Loading forecast...</div>
          </div>
        </div>
      </section>

      <!-- Right Column: Metrics, AQI, Sunrise/Sunset, Hourly Forecast -->
      <section class="right-column">
        <!-- Top 4 Metric Cards -->
        <div class="metrics-grid">
          <!-- Humidity Card -->
          <div class="glass-card metric-card">
            <div class="metric-icon-wrap">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                <path d="M7 16a4 4 0 0 0 4 4"></path>
              </svg>
            </div>
            <div class="metric-info">
              <span class="metric-label">Humidity</span>
              <span id="val-humidity" class="metric-value">-</span>
            </div>
          </div>

          <!-- Pressure Card -->
          <div class="glass-card metric-card">
            <div class="metric-icon-wrap">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12h5a3 3 0 0 0 3-3 3 3 0 0 0-3-3H2"></path>
                <path d="M2 17h12a3 3 0 0 0 3-3 3 3 0 0 0-3-3H2"></path>
                <path d="M2 7h19a3 3 0 0 1 3 3 3 3 0 0 1-3 3H2"></path>
              </svg>
            </div>
            <div class="metric-info">
              <span class="metric-label">Pressure</span>
              <span id="val-pressure" class="metric-value">-</span>
            </div>
          </div>

          <!-- Feels Like Card -->
          <div class="glass-card metric-card">
            <div class="metric-icon-wrap">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
              </svg>
            </div>
            <div class="metric-info">
              <span class="metric-label">Feels like</span>
              <span id="val-feels-like" class="metric-value">-</span>
            </div>
          </div>

          <!-- Visibility Card -->
          <div class="glass-card metric-card">
            <div class="metric-icon-wrap">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </div>
            <div class="metric-info">
              <span class="metric-label">Visibility</span>
              <span id="val-visibility" class="metric-value">-</span>
            </div>
          </div>
        </div>

        <!-- Middle Row: AQI & Sunrise/Sunset -->
        <div class="middle-grid">
          <!-- Air Quality Index (AQI) Card -->
          <div class="glass-card aqi-card">
            <div class="aqi-card-header">
              <span class="card-heading">Air Quality Index (AQI)</span>
              <span id="aqi-badge" class="badge aqi-badge">Good</span>
            </div>
            <div class="aqi-content">
              <div class="aqi-main-icon">
                <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path
                    d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2">
                  </path>
                </svg>
              </div>
              <div class="aqi-subgrid">
                <div class="aqi-item">
                  <span class="aqi-label">CO</span>
                  <span id="val-co" class="aqi-value">-</span>
                </div>
                <div class="aqi-item">
                  <span class="aqi-label">SO2</span>
                  <span id="val-so2" class="aqi-value">-</span>
                </div>
                <div class="aqi-item">
                  <span class="aqi-label">O3</span>
                  <span id="val-o3" class="aqi-value">-</span>
                </div>
                <div class="aqi-item">
                  <span class="aqi-label">NO2</span>
                  <span id="val-no2" class="aqi-value">-</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Sunrise & Sunset Card -->
          <div class="glass-card sun-card">
            <span class="card-heading">Sunrise & Sunset</span>
            <div class="sun-times-container">
              <!-- Sunrise -->
              <div class="sun-item">
                <div class="sun-illustration">
                  <div class="sun-glow"></div>
                  <svg viewBox="0 0 64 64" width="48" height="48">
                    <circle cx="32" cy="32" r="16" fill="#FDB813" />
                    <!-- Sun rays -->
                    <g stroke="#FDB813" stroke-width="3" stroke-linecap="round">
                      <line x1="32" y1="8" x2="32" y2="2" />
                      <line x1="32" y1="62" x2="32" y2="56" />
                      <line x1="8" y1="32" x2="2" y2="32" />
                      <line x1="62" y1="32" x2="56" y2="32" />
                      <line x1="15" y1="15" x2="10.8" y2="10.8" />
                      <line x1="53.2" y1="53.2" x2="49" y2="49" />
                      <line x1="15" y1="49" x2="10.8" y2="53.2" />
                      <line x1="53.2" y1="10.8" x2="49" y2="15" />
                    </g>
                  </svg>
                </div>
                <div class="sun-info">
                  <span class="sun-label">Sunrise</span>
                  <span id="val-sunrise" class="sun-val">-:-- Am</span>
                </div>
              </div>
              <!--SUNSET-->
              <div class="sun-item">
                <div class="moon-illustration">
                  <svg viewBox="0 0 64 64" width="48" height="48">
                    <defs>
                      <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#FFFFFF" />
                        <stop offset="70%" stop-color="#E2E8F0" />
                        <stop offset="100%" stop-color="#CBD5E1" />
                      </radialGradient>
                    </defs>
                    <circle cx="32" cy="32" r="18" fill="url(#moonGlow)" />
                    <circle cx="26" cy="24" r="3.2" fill="#94A3B8" opacity="0.6" />
                    <circle cx="37" cy="36" r="4.2" fill="#94A3B8" opacity="0.5" />
                    <circle cx="28" cy="40" r="2.2" fill="#94A3B8" opacity="0.5" />
                    <circle cx="38" cy="22" r="2.5" fill="#94A3B8" opacity="0.4" />
                  </svg>
                </div>
                <div class="sun-info">
                  <span class="sun-label">Sunset</span>
                  <span id="val-sunset" class="sun-val">-:-- Pm</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="glass-card today-hourly-card">
          <div class="hourly-header">
            <span class="card-heading">Today</span>
            <span class="hourly-subtitle">Hourly Forecast</span>
          </div>
          <div id="hourly-list" class="hourly-list">
            <div class="hourly-skeleton">Loading hourly forecast...</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>

</html>
